<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Soccer Sub Tracker — Phase 8 - Goals & Assists</title>
<meta name="description" content="Youth soccer roster, live substitution, and playing-time tracker" />
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #f4f7f2; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect, useMemo } = React;

// ---------- Storage adapter (localStorage — works on any static host) ----------
const hasStorage = typeof window !== "undefined" && typeof window.localStorage !== "undefined";
const ROSTER_KEY = "soccer-sub-tracker-roster";
const HISTORY_PREFIX = "soccer-sub-tracker-history:";

async function storageGet(key) {
  if (!hasStorage) return null;
  const v = window.localStorage.getItem(key);
  return v != null ? { key, value: v } : null;
}
async function storageSet(key, value) {
  if (!hasStorage) return null;
  window.localStorage.setItem(key, value);
  return { key, value };
}
async function storageDelete(key) {
  if (!hasStorage) return null;
  window.localStorage.removeItem(key);
  return { key, deleted: true };
}
async function storageList(prefix) {
  if (!hasStorage) return { keys: [] };
  const keys = [];
  for (let i = 0; i < window.localStorage.length; i++) {
    const k = window.localStorage.key(i);
    if (k && k.startsWith(prefix)) keys.push(k);
  }
  return { keys };
}

// ---------- Formation definition ----------
// 9v9 only: 3-4-1 with a diamond midfield (CDM at the base, wide LM/RM,
// CAM at the tip). x,y are percentages within the pitch box; category
// drives sub-eligibility.
const FORMATION_NAME = "9v9 — 3-4-1 (Diamond Midfield)";
const SLOTS_LAYOUT = [
  { id: "gk", label: "GK", category: "GK", x: 50, y: 92 },
  { id: "lb", label: "LB", category: "DEF", x: 20, y: 74 },
  { id: "cb", label: "CB", category: "DEF", x: 50, y: 78 },
  { id: "rb", label: "RB", category: "DEF", x: 80, y: 74 },
  { id: "cdm", label: "CDM", category: "MID", x: 50, y: 60 },
  { id: "lm", label: "LM", category: "MID", x: 14, y: 42 },
  { id: "rm", label: "RM", category: "MID", x: 86, y: 42 },
  { id: "cam", label: "CAM", category: "MID", x: 50, y: 27 },
  { id: "st", label: "ST", category: "FWD", x: 50, y: 11 },
];

const CATEGORIES = ["GK", "DEF", "MID", "FWD"];
const CAT_COLOR = { GK: "#e8b84b", DEF: "#4f8fd1", MID: "#4caf6f", FWD: "#e0653f" };
const CAT_NAME = { GK: "Goalkeeper", DEF: "Defender", MID: "Midfielder", FWD: "Forward" };
const RATING_LABEL = { 1: "Needs work", 2: "Solid", 3: "Great" };
const MANUAL_TAG = "Manual entry — no minutes tracked";

function fmtTime(totalSeconds) {
  const s = Math.max(0, Math.floor(totalSeconds));
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${String(sec).padStart(2, "0")}`;
}

function fmtDate(iso) {
  try {
    const d = new Date(iso);
    return (
      d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) +
      " · " +
      d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })
    );
  } catch {
    return iso;
  }
}

function playerKeyOf(p) {
  return p && p.id != null ? `id:${p.id}` : `name:${(p && p.name ? p.name : "").trim().toLowerCase()}`;
}

function csvEscape(val) {
  const s = String(val ?? "");
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function downloadCSV(filename, rows) {
  const csv = rows.map((row) => row.map(csvEscape).join(",")).join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function App() {
  const [tab, setTab] = useState("roster"); // roster | match | history | season
  const [rosterLoaded, setRosterLoaded] = useState(!hasStorage);
  const [players, setPlayers] = useState([]);
  const [slots, setSlots] = useState(() => SLOTS_LAYOUT.map((s) => ({ ...s, playerId: null })));
  const [running, setRunning] = useState(false);
  const [gameSeconds, setGameSeconds] = useState(0);
  const [subModalSlotId, setSubModalSlotId] = useState(null);
  const [showAllInModal, setShowAllInModal] = useState(false);
  const [subQueue, setSubQueue] = useState([]);
  const [saveStatus, setSaveStatus] = useState("");
  const [historyList, setHistoryList] = useState([]);
  const [historyLoading, setHistoryLoading] = useState(false);
  const [ratingOpenKey, setRatingOpenKey] = useState(null);
  const [goalsOpenKey, setGoalsOpenKey] = useState(null);
  const [goalEvents, setGoalEvents] = useState([]);
  const [goalModal, setGoalModal] = useState(null); // { scorerId: null } while open
  const [addPastGameOpen, setAddPastGameOpen] = useState(false);
  const [pastGameDate, setPastGameDate] = useState("");
  const [pastGameOpponent, setPastGameOpponent] = useState("");
  const [opponent, setOpponent] = useState("");

  const idRef = useRef(1);
  const queueIdRef = useRef(1);
  const goalEventIdRef = useRef(1);
  const saveStatusTimeout = useRef(null);

  const [formName, setFormName] = useState("");
  const [formNumber, setFormNumber] = useState("");
  const [formPositions, setFormPositions] = useState([]);

  useEffect(() => {
    if (!hasStorage) return;
    (async () => {
      try {
        const res = await storageGet(ROSTER_KEY);
        if (res && res.value) {
          const arr = JSON.parse(res.value);
          setPlayers(arr.map((p) => ({ ...p, fieldSeconds: 0, isOnField: false, goals: 0, assists: 0 })));
          const maxId = arr.reduce((m, p) => Math.max(m, p.id), 0);
          idRef.current = maxId + 1;
        }
      } catch (e) {}
      setRosterLoaded(true);
    })();
  }, []);

  async function persistRoster(list) {
    if (!hasStorage) return;
    try {
      const identity = list.map((p) => ({ id: p.id, name: p.name, number: p.number, positions: p.positions }));
      await storageSet(ROSTER_KEY, JSON.stringify(identity));
    } catch (e) {}
  }

  useEffect(() => {
    if (!running) return;
    const t = setInterval(() => {
      setGameSeconds((s) => s + 1);
      setPlayers((ps) => ps.map((p) => (p.isOnField ? { ...p, fieldSeconds: p.fieldSeconds + 1 } : p)));
    }, 1000);
    return () => clearInterval(t);
  }, [running]);

  useEffect(() => {
    setSubQueue((q) =>
      q.filter((item) => {
        const pl = players.find((pp) => pp.id === item.playerId);
        return pl && !pl.isOnField;
      })
    );
  }, [players]);

  function flashStatus(msg) {
    setSaveStatus(msg);
    if (saveStatusTimeout.current) clearTimeout(saveStatusTimeout.current);
    saveStatusTimeout.current = setTimeout(() => setSaveStatus(""), 2500);
  }

  function addPlayer(e) {
    e.preventDefault();
    if (!formName.trim()) return;
    const p = {
      id: idRef.current++,
      name: formName.trim(),
      number: formNumber.trim(),
      positions: formPositions.length ? formPositions : CATEGORIES.slice(),
      fieldSeconds: 0,
      isOnField: false,
      goals: 0,
      assists: 0,
    };
    setPlayers((ps) => {
      const next = [...ps, p];
      persistRoster(next);
      return next;
    });
    setFormName("");
    setFormNumber("");
    setFormPositions([]);
  }

  function deletePlayer(id) {
    setPlayers((ps) => {
      const next = ps.filter((p) => p.id !== id);
      persistRoster(next);
      return next;
    });
    setSlots((ss) => ss.map((s) => (s.playerId === id ? { ...s, playerId: null } : s)));
  }

  function toggleFormPosition(cat) {
    setFormPositions((cur) => (cur.includes(cat) ? cur.filter((c) => c !== cat) : [...cur, cat]));
  }

  function openSub(slotId) {
    setShowAllInModal(false);
    setSubModalSlotId(slotId);
  }

  function benchCurrentOccupant(slotId) {
    const slot = slots.find((s) => s.id === slotId);
    if (!slot || slot.playerId == null) return;
    const pid = slot.playerId;
    setPlayers((ps) => ps.map((p) => (p.id === pid ? { ...p, isOnField: false } : p)));
    setSlots((ss) => ss.map((s) => (s.id === slotId ? { ...s, playerId: null } : s)));
  }

  function subInPlayer(slotId, playerId) {
    setSlots((ss) => ss.map((s) => (s.id === slotId ? { ...s, playerId } : s)));
    setPlayers((ps) => ps.map((p) => (p.id === playerId ? { ...p, isOnField: true } : p)));
    setSubModalSlotId(null);
  }

  function subSwap(slotId, playerId) {
    benchCurrentOccupant(slotId);
    setSlots((ss) => ss.map((s) => (s.id === slotId ? { ...s, playerId } : s)));
    setPlayers((ps) => ps.map((p) => (p.id === playerId ? { ...p, isOnField: true } : p)));
    setSubModalSlotId(null);
  }

  function queueSub(slotId, playerId) {
    setSubQueue((q) => [...q, { id: queueIdRef.current++, slotId, playerId }]);
    setSubModalSlotId(null);
  }

  function cancelQueueItem(id) {
    setSubQueue((q) => q.filter((item) => item.id !== id));
  }

  function executeQueueItem(id) {
    const item = subQueue.find((i) => i.id === id);
    if (!item) return;
    const player = players.find((p) => p.id === item.playerId);
    if (!player || player.isOnField) {
      setSubQueue((q) => q.filter((i) => i.id !== id));
      return;
    }
    const slot = slots.find((s) => s.id === item.slotId);
    if (slot && slot.playerId != null) {
      subSwap(item.slotId, item.playerId);
    } else {
      subInPlayer(item.slotId, item.playerId);
    }
    setSubQueue((q) => q.filter((i) => i.id !== id));
  }

  function resetGame() {
    setRunning(false);
    setGameSeconds(0);
    setPlayers((ps) => ps.map((p) => ({ ...p, fieldSeconds: 0, isOnField: false, goals: 0, assists: 0 })));
    setSlots((ss) => ss.map((s) => ({ ...s, playerId: null })));
    setSubQueue([]);
    setGoalEvents([]);
    setOpponent("");
  }

  function openGoalModal() {
    setGoalModal({ scorerId: null });
  }

  function closeGoalModal() {
    setGoalModal(null);
  }

  function pickScorer(playerId) {
    setGoalModal({ scorerId: playerId });
  }

  function finishGoal(assistId) {
    if (!goalModal || goalModal.scorerId == null) return;
    const scorerId = goalModal.scorerId;
    const eventId = goalEventIdRef.current++;
    setPlayers((ps) =>
      ps.map((p) => {
        if (p.id === scorerId) return { ...p, goals: p.goals + 1 };
        if (assistId != null && p.id === assistId) return { ...p, assists: p.assists + 1 };
        return p;
      })
    );
    setGoalEvents((evs) => [...evs, { id: eventId, scorerId, assistId: assistId ?? null }]);
    setGoalModal(null);
  }

  function removeGoalEvent(eventId) {
    const ev = goalEvents.find((e) => e.id === eventId);
    if (!ev) return;
    setPlayers((ps) =>
      ps.map((p) => {
        if (p.id === ev.scorerId) return { ...p, goals: Math.max(0, p.goals - 1) };
        if (ev.assistId != null && p.id === ev.assistId) return { ...p, assists: Math.max(0, p.assists - 1) };
        return p;
      })
    );
    setGoalEvents((evs) => evs.filter((e) => e.id !== eventId));
  }

  function removeAssistOnly(eventId) {
    const ev = goalEvents.find((e) => e.id === eventId);
    if (!ev || ev.assistId == null) return;
    const assistId = ev.assistId;
    setPlayers((ps) => ps.map((p) => (p.id === assistId ? { ...p, assists: Math.max(0, p.assists - 1) } : p)));
    setGoalEvents((evs) => evs.map((e) => (e.id === eventId ? { ...e, assistId: null } : e)));
  }

  async function saveGameToHistory() {
    if (players.length === 0) return;
    if (!hasStorage) {
      flashStatus("Storage unavailable — can't save history here");
      return;
    }
    const key = `${HISTORY_PREFIX}${Date.now()}`;
    const record = {
      date: new Date().toISOString(),
      formation: FORMATION_NAME,
      opponent: opponent.trim(),
      durationSeconds: gameSeconds,
      players: players.map((p) => ({
        id: p.id,
        name: p.name,
        number: p.number,
        positions: p.positions,
        fieldSeconds: p.fieldSeconds,
      })),
      goals: Object.fromEntries(players.filter((p) => p.goals > 0).map((p) => [playerKeyOf(p), p.goals])),
      assists: Object.fromEntries(players.filter((p) => p.assists > 0).map((p) => [playerKeyOf(p), p.assists])),
      ratings: {},
      manual: false,
    };
    try {
      await storageSet(key, JSON.stringify(record));
      flashStatus("Game saved to history");
    } catch (e) {
      flashStatus("Could not save game");
    }
  }

  async function addPastGame() {
    if (!hasStorage) {
      flashStatus("Storage unavailable — can't save history here");
      return;
    }
    if (players.length === 0) return;
    const dateIso = pastGameDate ? new Date(pastGameDate + "T12:00:00").toISOString() : new Date().toISOString();
    const key = `${HISTORY_PREFIX}${Date.now()}`;
    const record = {
      date: dateIso,
      formation: FORMATION_NAME,
      opponent: pastGameOpponent.trim(),
      durationSeconds: 0,
      players: players.map((p) => ({
        id: p.id,
        name: p.name,
        number: p.number,
        positions: p.positions,
        fieldSeconds: 0,
      })),
      goals: {},
      assists: {},
      ratings: {},
      manual: true,
    };
    try {
      await storageSet(key, JSON.stringify(record));
      setAddPastGameOpen(false);
      setPastGameDate("");
      setPastGameOpponent("");
      loadHistory();
    } catch (e) {
      flashStatus("Could not save game");
    }
  }

  async function loadHistory() {
    if (!hasStorage) {
      setHistoryList([]);
      return;
    }
    setHistoryLoading(true);
    try {
      const res = await storageList(HISTORY_PREFIX);
      const keys = (res && res.keys) || [];
      const items = [];
      for (const k of keys) {
        try {
          const r = await storageGet(k);
          if (r && r.value) items.push({ key: k, ...JSON.parse(r.value) });
        } catch (e) {}
      }
      items.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
      setHistoryList(items);
    } catch (e) {
      setHistoryList([]);
    }
    setHistoryLoading(false);
  }

  useEffect(() => {
    if (tab === "history" || tab === "season") loadHistory();
    // eslint-disable-next-line
  }, [tab]);

  async function deleteHistoryEntry(key) {
    if (hasStorage) {
      try {
        await storageDelete(key);
      } catch (e) {}
    }
    loadHistory();
  }

  async function updateRating(record, pKey, rating) {
    const nextRating = record.ratings && record.ratings[pKey] === rating ? undefined : rating;
    const ratings = { ...(record.ratings || {}) };
    if (nextRating === undefined) delete ratings[pKey];
    else ratings[pKey] = nextRating;
    const updated = { ...record, ratings };
    setHistoryList((list) => list.map((h) => (h.key === record.key ? updated : h)));
    if (!hasStorage) return;
    try {
      const { key, ...toStore } = updated;
      await storageSet(record.key, JSON.stringify(toStore));
    } catch (e) {}
  }

  async function updateStatCount(record, field, pKey, delta) {
    const current = { ...(record[field] || {}) };
    const next = Math.max(0, (current[pKey] || 0) + delta);
    if (next === 0) delete current[pKey];
    else current[pKey] = next;
    const updated = { ...record, [field]: current };
    setHistoryList((list) => list.map((h) => (h.key === record.key ? updated : h)));
    if (!hasStorage) return;
    try {
      const { key, ...toStore } = updated;
      await storageSet(record.key, JSON.stringify(toStore));
    } catch (e) {}
  }

  const playerById = useMemo(() => {
    const m = new Map();
    players.forEach((p) => m.set(p.id, p));
    return m;
  }, [players]);

  const benchPlayers = useMemo(
    () => players.filter((p) => !p.isOnField).sort((a, b) => a.fieldSeconds - b.fieldSeconds),
    [players]
  );

  const onFieldPlayers = useMemo(
    () => players.filter((p) => p.isOnField).sort((a, b) => a.name.localeCompare(b.name)),
    [players]
  );

  const activeSlot = slots.find((s) => s.id === subModalSlotId) || null;
  const eligibleForModal = useMemo(() => {
    if (!activeSlot) return [];
    const pool = showAllInModal
      ? benchPlayers
      : benchPlayers.filter((p) => p.positions.includes(activeSlot.category));
    return pool;
  }, [activeSlot, benchPlayers, showAllInModal]);

  const totalOnField = players.filter((p) => p.isOnField).length;

  const seasonStats = useMemo(() => {
    const map = new Map();
    historyList.forEach((h) => {
      (h.players || []).forEach((p) => {
        const key = playerKeyOf(p);
        if (!map.has(key)) {
          map.set(key, { name: p.name, number: p.number, gamesPlayed: 0, minutesGames: 0, totalSeconds: 0, ratings: [], goals: 0, assists: 0 });
        }
        const entry = map.get(key);
        entry.gamesPlayed += 1;
        if (!h.manual) {
          entry.minutesGames += 1;
          entry.totalSeconds += p.fieldSeconds || 0;
        }
        const r = h.ratings && h.ratings[key];
        if (r) entry.ratings.push(r);
        entry.goals += (h.goals && h.goals[key]) || 0;
        entry.assists += (h.assists && h.assists[key]) || 0;
      });
    });
    const rows = Array.from(map.values())
      .map((e) => ({
        name: e.name,
        number: e.number,
        gamesPlayed: e.gamesPlayed,
        totalMinutes: e.totalSeconds / 60,
        avgMinutes: e.minutesGames ? e.totalSeconds / 60 / e.minutesGames : 0,
        avgRating: e.ratings.length ? e.ratings.reduce((a, b) => a + b, 0) / e.ratings.length : null,
        goals: e.goals,
        assists: e.assists,
      }))
      .sort((a, b) => b.totalMinutes - a.totalMinutes);
    const totalSeasonMinutes = rows.reduce((s, r) => s + r.totalMinutes, 0);
    return { rows, totalSeasonMinutes, gamesCount: historyList.length };
  }, [historyList]);

  function exportSeasonSummaryCSV() {
    const header = ["Player", "Number", "Games Played", "Total Minutes", "Avg Minutes/Game", "Goals", "Assists", "Avg Rating"];
    const rows = [
      header,
      ...seasonStats.rows.map((r) => [
        r.name,
        r.number,
        r.gamesPlayed,
        r.totalMinutes.toFixed(1),
        r.avgMinutes.toFixed(1),
        r.goals,
        r.assists,
        r.avgRating != null ? r.avgRating.toFixed(2) : "",
      ]),
    ];
    downloadCSV("season-summary.csv", rows);
  }

  function exportRawGameLogCSV() {
    const header = ["Date", "Opponent", "Formation", "Manual Entry", "Game Duration (min)", "Player", "Number", "Minutes Played", "Goals", "Assists", "Rating"];
    const rows = [header];
    historyList.forEach((h) => {
      (h.players || []).forEach((p) => {
        const key = playerKeyOf(p);
        const rating = h.ratings && h.ratings[key] != null ? h.ratings[key] : "";
        const goals = (h.goals && h.goals[key]) || 0;
        const assists = (h.assists && h.assists[key]) || 0;
        rows.push([
          fmtDate(h.date),
          h.opponent || "",
          h.formation,
          h.manual ? "Yes" : "No",
          (h.durationSeconds / 60).toFixed(1),
          p.name,
          p.number,
          ((p.fieldSeconds || 0) / 60).toFixed(1),
          goals,
          assists,
          rating,
        ]);
      });
    });
    downloadCSV("game-log.csv", rows);
  }

  return (
    <div className="app">
      <header className="topbar">
        <div className="topbar-title">
          <span>🛡</span>
          <span>Sub Tracker <span style={{ opacity: 0.6, fontWeight: 600 }}>· Phase 8</span></span>
        </div>
        <div className="tabs">
          <button className={tab === "roster" ? "tab active" : "tab"} onClick={() => setTab("roster")}>Roster</button>
          <button className={tab === "match" ? "tab active" : "tab"} onClick={() => setTab("match")}>Match</button>
          <button className={tab === "history" ? "tab active" : "tab"} onClick={() => setTab("history")}>History</button>
          <button className={tab === "season" ? "tab active" : "tab"} onClick={() => setTab("season")}>Season</button>
        </div>
      </header>

      {!hasStorage && (
        <div className="storage-banner">
          This browser doesn't support local storage, so the roster, history, and ratings won't be saved.
        </div>
      )}

      {tab === "roster" && (
        <main className="panel">
          <form className="card" onSubmit={addPlayer}>
            <h2>Add player</h2>
            <div className="row">
              <input className="input grow" placeholder="Player name" value={formName} onChange={(e) => setFormName(e.target.value)} />
              <input className="input num" placeholder="#" inputMode="numeric" value={formNumber} onChange={(e) => setFormNumber(e.target.value)} />
            </div>
            <div className="label-row">Eligible positions</div>
            <div className="chip-row">
              {CATEGORIES.map((c) => (
                <button type="button" key={c} className={"chip" + (formPositions.includes(c) ? " chip-on" : "")} style={{ "--chip-color": CAT_COLOR[c] }} onClick={() => toggleFormPosition(c)}>{c}</button>
              ))}
            </div>
            <div className="hint">Leave blank to allow any position.</div>
            <button className="btn primary" type="submit">+ Add to roster</button>
          </form>

          <div className="card">
            <h2>Roster <span className="muted">({players.length})</span></h2>
            {hasStorage && <div className="hint">Saved automatically in this browser — carries over between games.</div>}
            {!rosterLoaded && <div className="empty">Loading roster…</div>}
            {rosterLoaded && players.length === 0 && <div className="empty">No players yet. Add your squad above.</div>}
            {rosterLoaded && (
              <ul className="roster-list">
                {players.map((p) => (
                  <li key={p.id} className="roster-item">
                    <div className="jersey">{p.number || "–"}</div>
                    <div className="roster-info">
                      <div className="roster-name">{p.name}</div>
                      <div className="pos-badges">
                        {p.positions.map((c) => (<span key={c} className="badge" style={{ "--chip-color": CAT_COLOR[c] }}>{c}</span>))}
                      </div>
                    </div>
                    <button className="icon-btn" onClick={() => deletePlayer(p.id)} aria-label="Remove player">🗑</button>
                  </li>
                ))}
              </ul>
            )}
          </div>
        </main>
      )}

      {tab === "match" && (
        <main className="panel">
          <div className="card clockcard">
            <div className="clock-top">
              <div className="formation-name">{FORMATION_NAME}</div>
              <div className="onfield-count">👥 {totalOnField}/{slots.length}</div>
            </div>
            <input
              className="input"
              placeholder="Opponent (optional)"
              value={opponent}
              onChange={(e) => setOpponent(e.target.value)}
              style={{ width: "100%", textAlign: "center", marginBottom: 6 }}
            />
            <div className="clock-display">{fmtTime(gameSeconds)}</div>
            <div className="clock-controls">
              <button className="btn primary" onClick={() => setRunning((r) => !r)}>{running ? "❚❚ Pause" : "▶ Start"}</button>
              <button className="btn ghost" onClick={openGoalModal}>⚽ Log Goal</button>
              <button className="btn ghost" onClick={saveGameToHistory}>💾 Save</button>
              <button className="btn ghost" onClick={resetGame}>↺ Reset</button>
            </div>
            {saveStatus && <div className="save-status">{saveStatus}</div>}
          </div>

          {players.length === 0 ? (
            <div className="card"><div className="empty">Add players in the Roster tab first.</div></div>
          ) : (
            <>
              <div className="pitch-wrap">
                <div className="pitch">
                  <svg className="pitch-lines" viewBox="0 0 100 150" preserveAspectRatio="none">
                    <rect x="1" y="1" width="98" height="148" fill="none" stroke="white" strokeOpacity="0.55" strokeWidth="0.6" />
                    <line x1="1" y1="75" x2="99" y2="75" stroke="white" strokeOpacity="0.55" strokeWidth="0.6" />
                    <circle cx="50" cy="75" r="12" fill="none" stroke="white" strokeOpacity="0.55" strokeWidth="0.6" />
                    <rect x="25" y="1" width="50" height="18" fill="none" stroke="white" strokeOpacity="0.55" strokeWidth="0.6" />
                    <rect x="25" y="131" width="50" height="18" fill="none" stroke="white" strokeOpacity="0.55" strokeWidth="0.6" />
                  </svg>
                  {slots.map((s) => {
                    const p = s.playerId != null ? playerById.get(s.playerId) : null;
                    const queuedForSlot = subQueue.find((q) => q.slotId === s.id);
                    return (
                      <button key={s.id} className={"slot" + (p ? " filled" : " empty") + (queuedForSlot ? " queued" : "")} style={{ left: `${s.x}%`, top: `${s.y}%`, "--cat-color": CAT_COLOR[s.category] }} onClick={() => openSub(s.id)}>
                        {p ? (
                          <>
                            <div className="slot-num">{p.number || "–"}</div>
                            <div className="slot-name">{p.name.split(" ")[0]}</div>
                            <div className="slot-time">{fmtTime(p.fieldSeconds)}</div>
                          </>
                        ) : (
                          <>
                            <div className="slot-plus">+</div>
                            <div className="slot-label">{s.label}</div>
                          </>
                        )}
                        {queuedForSlot && <div className="queued-dot" title="Sub queued" />}
                        {p && p.goals > 0 && <div className="goal-badge" title={`${p.goals} goal${p.goals === 1 ? "" : "s"}`}>⚽{p.goals}</div>}
                        {p && p.assists > 0 && <div className="assist-badge" title={`${p.assists} assist${p.assists === 1 ? "" : "s"}`}>🎯{p.assists}</div>}
                      </button>
                    );
                  })}
                </div>
              </div>

              <div className="card">
                <h2>📋 Planned subs <span className="muted">({subQueue.length})</span></h2>
                <div className="hint">Queue subs ahead of time, then execute each one at the right moment.</div>
                {subQueue.length === 0 && <div className="empty">No subs queued. Tap a position on the pitch to plan one.</div>}
                <ul className="queue-list">
                  {subQueue.map((item) => {
                    const incoming = playerById.get(item.playerId);
                    const slot = slots.find((s) => s.id === item.slotId);
                    if (!incoming || !slot) return null;
                    const outgoing = slot.playerId != null ? playerById.get(slot.playerId) : null;
                    return (
                      <li key={item.id} className="queue-item">
                        <div className="queue-slot-tag" style={{ "--cat-color": CAT_COLOR[slot.category] }}>{slot.label}</div>
                        <div className="roster-info">
                          <div className="roster-name">{incoming.name}{outgoing ? <span className="muted"> for {outgoing.name}</span> : <span className="muted"> (fill in)</span>}</div>
                        </div>
                        <button className="icon-btn" onClick={() => cancelQueueItem(item.id)} aria-label="Cancel queued sub">✕</button>
                        <button className="btn primary small" onClick={() => executeQueueItem(item.id)}>✓ Execute</button>
                      </li>
                    );
                  })}
                </ul>
              </div>

              <div className="card">
                <h2>⚽ Goals this game <span className="muted">({goalEvents.length})</span></h2>
                <div className="hint">Tap "Log Goal" above to record one, or remove a mis-tap below.</div>
                {goalEvents.length === 0 && <div className="empty">No goals logged yet.</div>}
                <ul className="queue-list">
                  {goalEvents.map((ev) => {
                    const scorer = playerById.get(ev.scorerId);
                    if (!scorer) return null;
                    return (
                      <li key={ev.id} className="queue-item">
                        <div className="roster-info">
                          <div className="roster-name">⚽ {scorer.name}</div>
                        </div>
                        <button className="icon-btn" onClick={() => removeGoalEvent(ev.id)} aria-label="Remove goal">✕</button>
                      </li>
                    );
                  })}
                </ul>
              </div>

              <div className="card">
                <h2>🎯 Assists this game <span className="muted">({goalEvents.filter((ev) => ev.assistId != null).length})</span></h2>
                <div className="hint">Tracked separately from goals — each assist is tied to the goal it set up.</div>
                {goalEvents.filter((ev) => ev.assistId != null).length === 0 && <div className="empty">No assists logged yet.</div>}
                <ul className="queue-list">
                  {goalEvents
                    .filter((ev) => ev.assistId != null)
                    .map((ev) => {
                      const assister = playerById.get(ev.assistId);
                      const scorer = playerById.get(ev.scorerId);
                      if (!assister) return null;
                      return (
                        <li key={ev.id} className="queue-item">
                          <div className="roster-info">
                            <div className="roster-name">
                              🎯 {assister.name}
                              {scorer && <span className="muted"> (assisted {scorer.name})</span>}
                            </div>
                          </div>
                          <button className="icon-btn" onClick={() => removeAssistOnly(ev.id)} aria-label="Remove assist">✕</button>
                        </li>
                      );
                    })}
                </ul>
              </div>

              <div className="card">
                <h2>Bench <span className="muted">({benchPlayers.length})</span></h2>
                <div className="hint">Sorted by least playing time — sub these players in first.</div>
                {benchPlayers.length === 0 && <div className="empty">Everyone is on the field.</div>}
                <ul className="bench-list">
                  {benchPlayers.map((p) => (
                    <li key={p.id} className="bench-item">
                      <div className="jersey small">{p.number || "–"}</div>
                      <div className="roster-info">
                        <div className="roster-name">{p.name}</div>
                        <div className="pos-badges">{p.positions.map((c) => (<span key={c} className="badge" style={{ "--chip-color": CAT_COLOR[c] }}>{c}</span>))}</div>
                      </div>
                      <div className="bench-time">{fmtTime(p.fieldSeconds)}</div>
                    </li>
                  ))}
                </ul>
              </div>
            </>
          )}
        </main>
      )}

      {tab === "history" && (
        <main className="panel">
          <div className="card">
            <h2>📜 Game history</h2>
            {hasStorage && !addPastGameOpen && (
              <button className="btn ghost" onClick={() => setAddPastGameOpen(true)}>+ Add a past game</button>
            )}
            {hasStorage && addPastGameOpen && (
              <div className="past-game-form">
                <div className="label-row">Date</div>
                <input
                  className="input"
                  type="date"
                  value={pastGameDate}
                  onChange={(e) => setPastGameDate(e.target.value)}
                  style={{ marginBottom: 8, width: "100%" }}
                />
                <div className="label-row">Opponent</div>
                <input
                  className="input"
                  placeholder="Optional"
                  value={pastGameOpponent}
                  onChange={(e) => setPastGameOpponent(e.target.value)}
                  style={{ marginBottom: 8, width: "100%" }}
                />
                <div className="hint">
                  Uses your current roster. No minutes are tracked for this entry — you'll enter goals, assists, and ratings manually.
                </div>
                <div className="row">
                  <button className="btn ghost" onClick={() => setAddPastGameOpen(false)}>Cancel</button>
                  <button className="btn primary" onClick={addPastGame}>Save past game</button>
                </div>
              </div>
            )}
            {!hasStorage && <div className="empty">Local storage isn't available, so games can't be saved here.</div>}
            {hasStorage && historyLoading && <div className="empty">Loading…</div>}
            {hasStorage && !historyLoading && historyList.length === 0 && <div className="empty">No saved games yet. Save one from the Match tab, or add a past game above.</div>}
            {hasStorage && !historyLoading && historyList.length > 0 && (
              <ul className="history-list">
                {historyList.map((h) => {
                  const sortedPlayers = [...(h.players || [])].sort((a, b) => b.fieldSeconds - a.fieldSeconds);
                  const isRatingOpen = ratingOpenKey === h.key;
                  const isGoalsOpen = goalsOpenKey === h.key;
                  return (
                    <li key={h.key} className="history-item">
                      <div className="history-head">
                        <div>
                          <div className="history-date">
                            {fmtDate(h.date)}
                            {h.opponent && <span className="opponent-tag">vs {h.opponent}</span>}
                          </div>
                          <div className="hint" style={{ marginBottom: 0 }}>
                            {h.formation} · {h.manual ? MANUAL_TAG : `${fmtTime(h.durationSeconds)} on the clock`}
                          </div>
                        </div>
                        <button className="icon-btn" onClick={() => deleteHistoryEntry(h.key)} aria-label="Delete saved game">🗑</button>
                      </div>

                      <div className="row" style={{ marginBottom: 0 }}>
                        <button className="btn ghost small" onClick={() => setRatingOpenKey(isRatingOpen ? null : h.key)}>⭐ {isRatingOpen ? "Hide ratings" : "Rate players"}</button>
                        <button className="btn ghost small" onClick={() => setGoalsOpenKey(isGoalsOpen ? null : h.key)}>⚽ {isGoalsOpen ? "Hide goals/assists" : "Goals & assists"}</button>
                      </div>

                      {isRatingOpen && (
                        <ul className="rating-list">
                          {sortedPlayers.map((p, i) => {
                            const key = playerKeyOf(p);
                            const current = h.ratings && h.ratings[key];
                            return (
                              <li key={i} className="rating-row">
                                <div className="roster-name">{p.name}</div>
                                <div className="rating-buttons">
                                  {[1, 2, 3].map((n) => (
                                    <button key={n} className={"rating-btn" + (current === n ? " rating-on" : "")} title={RATING_LABEL[n]} onClick={() => updateRating(h, key, n)}>{n}</button>
                                  ))}
                                </div>
                              </li>
                            );
                          })}
                        </ul>
                      )}

                      {isGoalsOpen && (
                        <ul className="rating-list">
                          {sortedPlayers.map((p, i) => {
                            const key = playerKeyOf(p);
                            const g = (h.goals && h.goals[key]) || 0;
                            const a = (h.assists && h.assists[key]) || 0;
                            return (
                              <li key={i} className="ga-row">
                                <div className="roster-name">{p.name}</div>
                                <div className="ga-steppers">
                                  <div className="stepper">
                                    <span className="stepper-label">⚽</span>
                                    <button className="stepper-btn" onClick={() => updateStatCount(h, "goals", key, -1)}>−</button>
                                    <span className="stepper-value">{g}</span>
                                    <button className="stepper-btn" onClick={() => updateStatCount(h, "goals", key, 1)}>+</button>
                                  </div>
                                  <div className="stepper">
                                    <span className="stepper-label">🎯</span>
                                    <button className="stepper-btn" onClick={() => updateStatCount(h, "assists", key, -1)}>−</button>
                                    <span className="stepper-value">{a}</span>
                                    <button className="stepper-btn" onClick={() => updateStatCount(h, "assists", key, 1)}>+</button>
                                  </div>
                                </div>
                              </li>
                            );
                          })}
                        </ul>
                      )}

                      <ul className="history-players">
                        {sortedPlayers.map((p, i) => {
                          const key = playerKeyOf(p);
                          const rating = h.ratings && h.ratings[key];
                          const g = (h.goals && h.goals[key]) || 0;
                          const a = (h.assists && h.assists[key]) || 0;
                          return (
                            <li key={i} className="history-player-row">
                              <span className="roster-name">
                                {p.number ? `#${p.number} ` : ""}
                                {p.name}
                                {rating && <span className="rating-pill">{rating}</span>}
                                {g > 0 && <span className="ga-pill">⚽{g}</span>}
                                {a > 0 && <span className="ga-pill">🎯{a}</span>}
                              </span>
                              <span className="bench-time">{h.manual ? "–" : fmtTime(p.fieldSeconds)}</span>
                            </li>
                          );
                        })}
                      </ul>
                    </li>
                  );
                })}
              </ul>
            )}
          </div>
        </main>
      )}

      {tab === "season" && (
        <main className="panel">
          <div className="card">
            <h2>📊 Season summary</h2>
            <div className="hint">{seasonStats.gamesCount} game{seasonStats.gamesCount === 1 ? "" : "s"} logged · {seasonStats.totalSeasonMinutes.toFixed(0)} total player-minutes recorded</div>
            <button className="btn ghost" onClick={exportSeasonSummaryCSV}>⬇ Export season summary (CSV)</button>
            <div style={{ height: 8 }} />
            <button className="btn ghost" onClick={exportRawGameLogCSV}>⬇ Export raw game log (CSV)</button>
          </div>

          <div className="card">
            <h2>Per-player averages</h2>
            {seasonStats.rows.length === 0 && <div className="empty">No games saved yet.</div>}
            {seasonStats.rows.length > 0 && (
              <div className="table-wrap">
                <table className="season-table">
                  <thead><tr><th>Player</th><th>GP</th><th>Total min</th><th>Avg min</th><th>G</th><th>A</th><th>Avg rating</th></tr></thead>
                  <tbody>
                    {seasonStats.rows.map((r, i) => (
                      <tr key={i}>
                        <td>{r.number ? `#${r.number} ` : ""}{r.name}</td>
                        <td>{r.gamesPlayed}</td>
                        <td>{r.totalMinutes.toFixed(0)}</td>
                        <td>{r.avgMinutes.toFixed(1)}</td>
                        <td>{r.goals}</td>
                        <td>{r.assists}</td>
                        <td>{r.avgRating != null ? r.avgRating.toFixed(1) : "–"}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </main>
      )}

      {activeSlot && (
        <div className="modal-backdrop" onClick={() => setSubModalSlotId(null)}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <div><div className="modal-title">{activeSlot.label} <span className="cat-tag" style={{ "--chip-color": CAT_COLOR[activeSlot.category] }}>{CAT_NAME[activeSlot.category]}</span></div></div>
              <button className="icon-btn" onClick={() => setSubModalSlotId(null)}>✕</button>
            </div>

            {activeSlot.playerId != null && (
              <div className="current-occupant">
                <div className="jersey">{playerById.get(activeSlot.playerId)?.number || "–"}</div>
                <div className="roster-info">
                  <div className="roster-name">{playerById.get(activeSlot.playerId)?.name}</div>
                  <div className="hint">On field {fmtTime(playerById.get(activeSlot.playerId)?.fieldSeconds || 0)}</div>
                </div>
                <button className="btn ghost small" onClick={() => benchCurrentOccupant(activeSlot.id)}>Bench</button>
              </div>
            )}

            <div className="modal-section-title">{activeSlot.playerId != null ? "Sub in from bench" : "Assign from bench"}</div>
            <div className="hint">
              {showAllInModal ? "Showing all bench players." : `Showing players eligible for ${activeSlot.label}.`}{" "}
              <button className="link" onClick={() => setShowAllInModal((v) => !v)}>{showAllInModal ? "Show eligible only" : "Show all bench players"}</button>
            </div>

            <ul className="modal-list">
              {eligibleForModal.length === 0 && <div className="empty">No bench players available.</div>}
              {eligibleForModal.map((p) => (
                <li key={p.id} className="modal-row">
                  <div className="jersey small">{p.number || "–"}</div>
                  <div className="roster-info">
                    <div className="roster-name">{p.name}</div>
                    <div className="pos-badges">{p.positions.map((c) => (<span key={c} className="badge" style={{ "--chip-color": CAT_COLOR[c] }}>{c}</span>))}</div>
                  </div>
                  <div className="bench-time">{fmtTime(p.fieldSeconds)}</div>
                  <div className="modal-btn-group">
                    <button className="btn ghost small" onClick={() => queueSub(activeSlot.id, p.id)}>Queue</button>
                    <button className="btn primary small" onClick={() => (activeSlot.playerId != null ? subSwap(activeSlot.id, p.id) : subInPlayer(activeSlot.id, p.id))}>Now</button>
                  </div>
                </li>
              ))}
            </ul>
          </div>
        </div>
      )}

      {goalModal && (
        <div className="modal-backdrop" onClick={closeGoalModal}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <div className="modal-title">{goalModal.scorerId == null ? "Who scored?" : "Assist? (optional)"}</div>
              <button className="icon-btn" onClick={closeGoalModal}>✕</button>
            </div>

            {goalModal.scorerId == null ? (
              <>
                <div className="hint">Choose from players currently on the field.</div>
                <ul className="modal-list">
                  {onFieldPlayers.length === 0 && <div className="empty">No players on the field.</div>}
                  {onFieldPlayers.map((p) => (
                    <li key={p.id} className="modal-row">
                      <div className="jersey small">{p.number || "–"}</div>
                      <div className="roster-info">
                        <div className="roster-name">{p.name}</div>
                      </div>
                      <button className="btn primary small" onClick={() => pickScorer(p.id)}>Scored</button>
                    </li>
                  ))}
                </ul>
              </>
            ) : (
              <>
                <div className="hint">
                  Goal: <strong>{playerById.get(goalModal.scorerId)?.name}</strong>. Pick who assisted, or skip.
                </div>
                <ul className="modal-list">
                  <li className="modal-row">
                    <div className="roster-info"><div className="roster-name">No assist</div></div>
                    <button className="btn primary small" onClick={() => finishGoal(null)}>Confirm</button>
                  </li>
                  {onFieldPlayers.filter((p) => p.id !== goalModal.scorerId).map((p) => (
                    <li key={p.id} className="modal-row">
                      <div className="jersey small">{p.number || "–"}</div>
                      <div className="roster-info"><div className="roster-name">{p.name}</div></div>
                      <button className="btn primary small" onClick={() => finishGoal(p.id)}>Assist</button>
                    </li>
                  ))}
                </ul>
              </>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<style>
:root {
  --grass-a: #1e5a38;
  --grass-b: #22643f;
  --ink: #0f2419;
  --paper: #f4f7f2;
  --line: #d8e2da;
  --navy: #14263a;
  --accent: #e8b84b;
}
* { box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--paper); color: var(--ink); padding-bottom: 32px; }
.topbar { position: sticky; top: 0; z-index: 5; background: var(--navy); color: white; padding: 12px 14px 0 14px; }
.topbar-title { display: flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: 0.02em; font-size: 17px; padding-bottom: 10px; }
.tabs { display: flex; gap: 2px; }
.tab { flex: 1; background: transparent; border: none; color: rgba(255,255,255,0.65); font-weight: 700; font-size: 12px; padding: 10px 0; border-bottom: 3px solid transparent; cursor: pointer; }
.tab.active { color: white; border-bottom-color: var(--accent); }
.storage-banner { background: #fff4d6; color: #6b4c10; font-size: 12px; font-weight: 600; padding: 8px 14px; border-bottom: 1px solid #f0dca0; }
.panel { padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.card { background: white; border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.card h2 { margin: 0 0 10px 0; font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 4px; }
.muted { color: #7c8b81; font-weight: 600; }
.row { display: flex; gap: 8px; margin-bottom: 10px; }
.input { border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 15px; background: var(--paper); color: var(--ink); }
.input.grow { flex: 1; }
.input.num { width: 64px; text-align: center; }
.label-row { font-size: 12px; font-weight: 700; color: #5a6b60; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.chip { border: 1.5px solid var(--chip-color); color: var(--chip-color); background: white; border-radius: 999px; padding: 7px 14px; font-weight: 800; font-size: 13px; cursor: pointer; }
.chip-on { background: var(--chip-color); color: white; }
.hint { font-size: 12px; color: #7c8b81; margin-bottom: 10px; }
.link { background: none; border: none; color: var(--navy); font-weight: 700; text-decoration: underline; cursor: pointer; padding: 0; font-size: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: none; border-radius: 10px; padding: 11px 16px; font-weight: 800; font-size: 14px; cursor: pointer; white-space: nowrap; }
.btn.primary { background: var(--navy); color: white; width: 100%; }
.btn.ghost { background: var(--paper); color: var(--navy); border: 1.5px solid var(--line); width: 100%; }
.btn.small { padding: 7px 12px; font-size: 13px; width: auto; }
.empty { color: #8a988e; font-size: 13px; padding: 10px 0; text-align: center; }
.roster-list, .bench-list, .modal-list, .queue-list, .history-list, .history-players, .rating-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.roster-item, .bench-item, .modal-row, .current-occupant, .queue-item { display: flex; align-items: center; gap: 10px; padding: 8px; border: 1px solid var(--line); border-radius: 10px; }
.jersey { width: 34px; height: 34px; min-width: 34px; background: var(--navy); color: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; }
.jersey.small { width: 28px; height: 28px; font-size: 12px; }
